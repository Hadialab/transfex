<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1b4b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>TransFex — Shipment Tracking</title>
    <script>
      // Apply the saved theme before first paint, otherwise a light-mode user
      // sees a dark flash while the bundle loads and Zustand rehydrates.
      // Keep the storage key in sync with src/stores/themeStore.ts.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('transfex-theme') || 'null');
          var isDark = saved && saved.state ? saved.state.isDark : true;
          document.documentElement.classList.toggle('dark', isDark);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', isDark ? '#020617' : '#ffffff');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
